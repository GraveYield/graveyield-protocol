[package]
name = "grave-vault"
description = "GraveVault: settlement program. Executes salvages, distributes proceeds 40/40/20, and serves claims."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "grave_vault"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
    "grave-scanner/idl-build",
]
# Anchor 0.32.x's `#[program]` macro emits `#[cfg(feature = "anchor-debug")]`
# tags. Declaring the feature here silences the unexpected_cfgs lint on
# Rust 1.80+. The feature is a no-op flag the macro author uses internally.
anchor-debug = []

[dependencies]
anchor-lang = { workspace = true, features = ["init-if-needed"] }
anchor-spl  = { workspace = true }
grave-scanner = { path = "../grave-scanner", features = ["cpi"] }
# SHA-256 hasher for merkle.rs Merkle proof verification. Anchor 0.32
# dropped the `solana_program::hash` re-export — sha256 now lives in
# the standalone `solana-sha256-hasher` crate. Pinned at 2.x to match
# the Solana 3.0.10 stack transitively pulled by anchor-lang 0.32.1.
solana-sha256-hasher = "3"

[dev-dependencies]
# Host-test builds execute `hashv` off the solana target, where
# solana-sha256-hasher 3.x requires the `sha2` software implementation
# (the on-chain BPF build uses the runtime syscall instead). Without
# this feature the merkle host tests compile but panic at runtime —
# introduced by the dependabot 2.3.0 -> 3.1.0 bump and caught by the
# Phase 1.3 verification pass.
solana-sha256-hasher = { version = "3.1.0", features = ["sha2"] }
# Phase 2.1 fork harness (tests/raydium_v4_fork.rs): executes the real
# salvage_pool instruction against real mainnet Raydium V4 / OpenBook /
# SPL token bytecode inside an in-process Solana VM. The 2.3 line is
# aligned with the solana-program 2.3.x transitively pulled by
# anchor-lang 0.32.1 (see Cargo.lock).
solana-program-test = "2.3"
solana-sdk = "2.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
# Phase 5.3 claims fork harness (tests/lp_claim_fork.rs): the claim path
# must run on the REAL off-chain producer — the snapshot, Merkle tree, and
# sealed artifact come from grave-snapshotter, not a hand-built tree (the
# Phase 4 suite's documented stand-in). Dev-only edge, and the snapshotter
# only dev-depends back on grave-vault, so no build cycle exists.
grave-snapshotter = { path = "../../snapshotter" }
