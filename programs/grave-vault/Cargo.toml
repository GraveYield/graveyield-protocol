[package]
name = "grave-vault"
description = "GraveVault: settlement program. Executes salvages, distributes proceeds 40/40/20, and serves claims."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "grave_vault"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
    "grave-scanner/idl-build",
]
# Anchor's `#[program]` macro emits `#[cfg(feature = "anchor-debug")]`
# tags (0.32.x era behavior; kept declared under 1.2.2 as a no-op flag in
# case the macro re-emits them). Declaring the feature here silences the
# unexpected_cfgs lint on Rust 1.80+.
anchor-debug = []

[dependencies]
anchor-lang = { workspace = true, features = ["init-if-needed"] }
anchor-spl  = { workspace = true }
grave-scanner = { path = "../grave-scanner", features = ["cpi"] }
# SHA-256 hasher for merkle.rs Merkle proof verification. Anchor dropped
# the `solana_program::hash` re-export generations ago — sha256 lives in
# the standalone `solana-sha256-hasher` crate. Pinned to the 3.x line to
# match the agave solana-* 3.1.x stack transitively pulled by anchor-lang
# 1.2.2 (single lockfile instance across program and host builds).
solana-sha256-hasher = "3"

[dev-dependencies]
# Phase 7 security hardening: property-based fuzz/invariant tests for the
# Merkle verifier and the settlement arithmetic (runs on the pinned stable
# toolchain — no nightly/cargo-fuzz required).
proptest = "1"
# Host-test builds execute `hashv` off the solana target, where
# solana-sha256-hasher 3.x requires the `sha2` software implementation
# (the on-chain BPF build uses the runtime syscall instead). Without
# this feature the merkle host tests compile but panic at runtime —
# introduced by the dependabot 2.3.0 -> 3.1.0 bump and caught by the
# Phase 1.3 verification pass.
solana-sha256-hasher = { version = "3.1.0", features = ["sha2"] }
# Phase 2.1 fork harness (tests/raydium_v4_fork.rs): executes the real
# salvage_pool instruction against real mainnet Raydium V4 / OpenBook /
# SPL token bytecode inside an in-process Solana VM. The 3.1 line —
# aligned with the solana-program 3.1.x transitively pulled by anchor-lang
# 1.2.2 (see Cargo.lock), and carries tokio-tungstenite 0.28 / rustls
# 0.23 — eliminating the rustls-0.21 carrier of the 2.3 line
# (Dependabot alerts #9-#11). solana-sdk stays on the "3" facade (3.0.0;
# there is no 3.1.x facade release) — its caret component reqs resolve
# the SAME 3.1.x instances program-test 3.1.x uses. The
# agave-unstable-api feature acknowledges the program-test surface the
# harness depends on (required from agave 4.0 on; silences the
# deprecation gate the whole suite would otherwise trip).
solana-program-test = { version = "3.1", features = ["agave-unstable-api"] }
solana-sdk = "3"
# Canonical sysvar/program addresses (agave split-crate era): the fork
# harness references system_program::ID; the facade no longer carries it.
solana-sdk-ids = "3.1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
# Phase 5.3 claims fork harness (tests/lp_claim_fork.rs): the claim path
# must run on the REAL off-chain producer — the snapshot, Merkle tree, and
# sealed artifact come from grave-snapshotter, not a hand-built tree (the
# Phase 4 suite's documented stand-in). Dev-only edge, and the snapshotter
# only dev-depends back on grave-vault, so no build cycle exists.
grave-snapshotter = { path = "../../snapshotter" }
