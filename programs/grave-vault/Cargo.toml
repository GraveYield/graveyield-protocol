[package]
name = "grave-vault"
description = "GraveVault: settlement program. Executes salvages, distributes proceeds 40/40/20, and serves claims."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "grave_vault"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
    "grave-scanner/idl-build",
]
# Anchor 0.32.x's `#[program]` macro emits `#[cfg(feature = "anchor-debug")]`
# tags. Declaring the feature here silences the unexpected_cfgs lint on
# Rust 1.80+. The feature is a no-op flag the macro author uses internally.
anchor-debug = []

[dependencies]
anchor-lang = { workspace = true, features = ["init-if-needed"] }
anchor-spl  = { workspace = true }
grave-scanner = { path = "../grave-scanner", features = ["cpi"] }
# SHA-256 hasher for merkle.rs Merkle proof verification. Anchor 0.32
# dropped the `solana_program::hash` re-export — sha256 now lives in
# the standalone `solana-sha256-hasher` crate. Pinned at 2.x to match
# the Solana 3.0.10 stack transitively pulled by anchor-lang 0.32.1.
solana-sha256-hasher = "2"
