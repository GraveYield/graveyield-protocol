[package]
name = "grave-scanner"
description = "GraveScanner: on-chain eligibility evaluation and two-phase certification for derelict pools."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "grave_scanner"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Anchor 0.32.x's `#[program]` macro emits `#[cfg(feature = "anchor-debug")]`
# tags. Declaring the feature here silences the unexpected_cfgs lint on
# Rust 1.80+. The feature is a no-op flag the macro author uses internally.
anchor-debug = []

[dependencies]
# `init-if-needed` powers the D10 cert lifecycle: `evaluate_pool_phase2`
# creates the EligibilityCert PDA with `init_if_needed` and reissues it
# in place once expired (the handler's expiry gate + full-field rewrite
# are the reinitialization-attack mitigations — see
# instructions/evaluate_pool_phase2.rs and spec D10). Same pattern the
# vault already uses for its PDAs.
anchor-lang = { workspace = true, features = ["init-if-needed"] }
anchor-spl  = { workspace = true }

[dev-dependencies]
solana-sha256-hasher = { version = "3.1.0", features = ["sha2"] }
