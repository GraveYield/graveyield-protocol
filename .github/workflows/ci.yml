name: CI

# Supply-chain posture (P5-07, Stage B): every third-party action is pinned
# to a full commit SHA (version noted in a trailing comment; Dependabot's
# github-actions ecosystem keeps the pairs current), and the platform-tools
# tarball — the toolchain that produces the deployed ELFs — is sha256-verified
# before extraction. The remaining unverified fetch is the Solana CLI
# installer (release.anza.xyz publishes no signed checksums); documented as a
# known limitation in the Phase 5.1 register rather than silently accepted.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly run so the sdk-sync drift check also fires when ONLY the
  # vendored copy in GraveYield/salvor-bots changes (a push there cannot
  # trigger this workflow). See the sdk-sync-check job below.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Aligned with the official Solana 3.x stack:
  # https://solana.com/docs/intro/installation
  SOLANA_VERSION: 3.0.10
  ANCHOR_VERSION: 1.2.2
  # SBPF target architecture for `anchor build`. Anchor 1.2.2 defaults to
  # `--arch v3` (triple sbpfv3-solana-solana, e_machine 247 / e_flags 3),
  # while the deployment and rehearsal flows (`scripts/devnet/deploy_devnet.sh`,
  # plain `cargo build-sbf`) build the DEFAULT v0 target (triple
  # sbpf-solana-solana, e_machine 263 / e_flags 0). DR-001/NS-2 requires the
  # CI artifact to be byte-identical to what the deployment flow builds, so
  # the arch must match the deploy flow, not anchor's default. (Anchor 1.2.2
  # reads this env var as BUILD_ARCH_ENV — see its `default_build_arch()`.)
  ANCHOR_BUILD_SBF_ARCH: v0
  # Host toolchain. Must match rust-toolchain.toml.
  RUST_TOOLCHAIN: 1.91.1
  NODE_VERSION: 24
  PNPM_VERSION: 9

jobs:
  rust-fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head, pinned 2026-11-01
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust-clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head, pinned 2026-11-01
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --all-targets -- -D warnings

  # Baseline audit (Phase 0, blocker B4 / NS-5): the repo had 668 passing
  # host/TS tests locally but CI gated on ZERO of them — fmt, clippy,
  # anchor build and typecheck only. These two jobs make the existing
  # suites merge-blocking. The fork harness (47+ tests, needs cargo
  # build-sbf + multi-MB mainnet fixtures) lives in fork-harness.yml.
  rust-host-tests:
    name: cargo test (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head, pinned 2026-11-01
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: grave-scanner (lib)
        run: cargo test -p grave-scanner --lib
      - name: grave-vault (lib)
        run: cargo test -p grave-vault --lib
      - name: grave-snapshotter (lib + integration)
        run: cargo test -p grave-snapshotter

  ts-build-and-test:
    name: pnpm build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Ordering note: setup-node MUST come before pnpm/action-setup@v6
      # (see ts-typecheck below).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # Includes the SDK's live-devnet smoke tests: read-only RPC calls
      # against public devnet, no keys required. If devnet itself is
      # degraded the job fails — treat that as a real operational signal,
      # not flake (the SDK refuses to ship untested against the cluster).
      # The suite self-skips unless DEVNET_RPC_URL is set; the scheduled
      # devnet-smoke workflow covers the gap between pushes.
      - run: pnpm -r test
        env:
          DEVNET_RPC_URL: https://api.devnet.solana.com

  # NS-4 (baseline blocker B3): the shared salvor SDK used to live in two
  # copies that drifted silently (FLEET-M0 audit F1/F5/F7 — priority-fee
  # unit mismatch, launch-price inversion, base58-vs-byte snapshot sort),
  # with the fixes stranded only in the salvor-bots copy. sdk/src/ is now
  # the single source of truth; salvor-bots/src/ is a vendored mirror.
  # This job fails on ANY divergence. Both repos are public, so a token
  # is not required to read salvor-bots. The weekly cron on this workflow
  # additionally catches salvor-side-only edits: a push to GraveYield/
  # salvor-bots cannot trigger this workflow, so without the schedule the
  # mirror could drift for weeks unnoticed.
  #
  # Companion-branch resolution: when this workflow runs for a branch
  # push/PR whose branch name also exists on GraveYield/salvor-bots, the
  # mirror is validated against THAT branch so the two companion PRs can
  # travel through review in tandem (e.g. ns3/devnet-preparation exists
  # on both repos). Otherwise — pushes and crons on main — the check
  # enforces main == main with the same strict byte-equality as before.
  # A red main build after a protocol-side merge means: merge the
  # salvor-bots companion PR first (the mirror drifted or is mid-sync).
  sdk-sync-check:
    name: sdk sync (salvor-bots mirror)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out salvor-bots mirror (companion branch if present, else main)
        run: |
          set -euo pipefail
          SALVOR_REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if ! git ls-remote --exit-code --heads https://github.com/GraveYield/salvor-bots.git "$SALVOR_REF" >/dev/null 2>&1; then
            SALVOR_REF="main"
          fi
          echo "salvor-bots mirror ref: $SALVOR_REF"
          git clone --depth 1 --branch "$SALVOR_REF" https://github.com/GraveYield/salvor-bots.git _salvor-bots
      - name: Fail on any SDK divergence
        run: |
          set -euo pipefail
          echo "Enforcing byte-equality of the shared SDK modules:"
          echo "  graveyield-protocol/sdk/src  (single source of truth)"
          echo "  salvor-bots/src              (vendored mirror)"
          diff -r sdk/src _salvor-bots/src
          echo "in sync: sdk/src == salvor-bots/src (policy: sdk/README.md)"

  anchor-build:
    name: anchor build
    runs-on: ubuntu-latest
    # CI-hang guard (run 42460376811): the healthy job completes in ~5 min
    # warm (4m19s on run 43031593750) and ~20-25 min from a cold toolchain
    # cache. Without an explicit cap, a hung process consumed GitHub's
    # default 360-minute job window before anyone could cancel it. The cap
    # is 75 min: ~3x the cold path, with the window above the old 45
    # reserved for the bounded 40-min apt DNS-outage retry budget below
    # plus its one-apt-round overshoot (2026-11-11 incidents — see
    # "Install system libraries"). Any hang is still hard-bounded; the
    # extra ceiling exists so a prolonged runner-side outage can be
    # waited out instead of failing the job.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head, pinned 2026-11-01
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Node + pnpm are installed here (not because anchor needs them) so
      # that scripts/check-toolchain.sh below can verify ALL five pinned
      # toolchains — solana, anchor, rust, node, pnpm — in the single job
      # where the Rust/Solana side is actually present. Without these two
      # steps the toolchain check would fail on the missing JS side; with
      # them, a drift in ANY pin (rust-toolchain.toml, packageManager,
      # NODE_VERSION, SOLANA_VERSION, ANCHOR_VERSION) fails this job.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      # cargo-binstall was the original choice for speed but silently
      # no-ops on anchor-cli (observed on 0.32.x): it exits 0 without installing the
      # `anchor` binary on PATH (verified across multiple CI runs — the
      # Install Anchor CLI step reports 0 seconds and success, then
      # `anchor build` exits in 1 second with "command not found").
      # cargo install --locked compiles from source (~5-7 min cold, cached
      # by Swatinem/rust-cache@v2) and reliably places `anchor` in
      # ~/.cargo/bin. The trailing `anchor --version` is a load-bearing
      # assertion so future install regressions fail here rather than
      # leaking to the build step where the symptom is opaque.
      # Install system libraries needed by `anchor-cli` 1.2.2's transitive
      # build deps before `cargo install` recompiles them from source.
      # `hidapi 2.6.3` (pulled in via anchor-cli → solana-cli →
      # solana-remote-wallet) runs `pkg-config --libs --cflags libudev` from
      # its build.rs and panics with "could not find system library 'libudev'
      # required by the 'hidapi' crate" when the dev headers are missing.
      # The GitHub-hosted `ubuntu-latest` image ships `libudev1` (runtime) but
      # NOT `libudev-dev` (headers), so a fresh build from source fails. When
      # `Swatinem/rust-cache@v2` has a warm anchor-cli binary the build is
      # skipped and the missing headers are masked — that's why some past runs
      # passed. The cold path (PRs from forks, cache key rotation, weekly
      # cache eviction) reliably reproduces the failure seen in run
      # 37252277928. Install `libudev-dev` (and `libhidapi-dev` as a defensive
      # measure against future hidapi version bumps that may also probe for
      # the hidapi system library) before compiling anchor-cli.
      - name: Install system libraries for anchor-cli build
        run: |
          set -euo pipefail
          # Three live incidents on 2026-11-11, all runner-side (not repo
          # failures): run 43036634800 — the runner's default apt mirror
          # (azure.archive.ubuntu.com) failed DNS for ~6 straight minutes,
          # so the single-shot apt-get exited 100; run 43043702834 — the
          # same mirror stayed unreachable for the ENTIRE old 45-minute job
          # budget while the retry loop kept grinding; run 43053088751 — a
          # runner-side DNS outage kept every ubuntu.com hostname
          # unresolvable for ~31 minutes, outlasting the old 6-attempt
          # escalation loop in this job AND in fork-harness.yml. Strategy:
          #   1. attempt 1 uses the runner's default mirror; after it
          #      loses a full attempt, later attempts go through the
          #      CANONICAL mirrors (archive.ubuntu.com / security.ubuntu.com
          #      — Fastly-CDN backed, independent of the regional mirror)
          #      via a standalone temporary source list; the runner's own
          #      apt configuration is never mutated. The codename comes
          #      from /etc/os-release, so the fallback survives runner
          #      image migrations (e.g. ubuntu-latest -> Ubuntu 26).
          #   2. between attempts the step waits out dead-DNS windows with
          #      cheap resolver probes (a failed getent costs seconds; a
          #      failed apt-get round burns ~5-6 minutes inside its own
          #      fetch timeouts), so a long outage is outlasted by probing,
          #      not by grinding apt against a dead resolver.
          #   3. the whole step runs under a single 40-minute wall-clock
          #      budget that bounds the WAITING between attempts, never a
          #      running apt round: killing apt-get install mid-flight
          #      risks an interrupted dpkg state, which would turn a
          #      transient outage into a permanent failure. Exact exit
          #      paths: budget exhausted before the next wait; resolver
          #      still dead when the budget expires while probing. DNS
          #      observed healthy always earns one more attempt, even in
          #      the budget's final seconds. The worst-case step ceiling
          #      is therefore budget + 20s settle + one apt round (~6 min,
          #      apt's own fetch timeouts), which the job-level
          #      timeout-minutes is sized against. Exhaustion still fails
          #      the job (fail-closed): a missing libudev-dev must never
          #      be silently masked further down.
          APT_RETRY_BUDGET_SECONDS="${APT_RETRY_BUDGET_SECONDS:-2400}"   # 40 min default; job timeout is 75 min
          DEADLINE=$((SECONDS + APT_RETRY_BUDGET_SECONDS))
          # Probe the resolver directly: a failed getent costs seconds,
          # while a failed apt-get round burns ~5-6 minutes inside its own
          # fetch timeouts. Returns 0 as soon as any apt mirror hostname
          # resolves again, 1 if the budget expires while DNS is dead.
          apt_wait_for_dns() {
            while [ "$SECONDS" -lt "$DEADLINE" ]; do
              for host in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com; do
                if getent hosts "$host" >/dev/null 2>&1; then
                  echo "::notice::DNS probe: ${host} resolved (t+${SECONDS}s); retrying apt"
                  return 0
                fi
              done
              sleep 15
            done
            return 1
          }
          APT_SRC_OPTS=()
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            echo "::notice::apt refresh+install attempt ${attempt} (t+${SECONDS}s of ${APT_RETRY_BUDGET_SECONDS}s budget)"
            if sudo apt-get "${APT_SRC_OPTS[@]}" -o Acquire::Retries=3 update \
              && sudo apt-get "${APT_SRC_OPTS[@]}" -o Acquire::Retries=3 install -y --no-install-recommends libudev-dev libhidapi-dev
            then
              echo "::notice::apt refresh+install succeeded on attempt ${attempt} (t+${SECONDS}s)"
              break
            fi
            if [ "$attempt" = 1 ]; then
              # The default mirror lost a full attempt: route later
              # attempts through the canonical mirrors instead.
              . /etc/os-release
              CANONICAL_SOURCES="$(mktemp)"
              printf '%s\n' \
                "deb http://archive.ubuntu.com/ubuntu/ ${VERSION_CODENAME} main restricted universe multiverse" \
                "deb http://archive.ubuntu.com/ubuntu/ ${VERSION_CODENAME}-updates main restricted universe multiverse" \
                "deb http://security.ubuntu.com/ubuntu/ ${VERSION_CODENAME}-security main restricted universe multiverse" \
                > "$CANONICAL_SOURCES"
              APT_SRC_OPTS=(-o "Dir::Etc::sourcelist=$CANONICAL_SOURCES" -o Dir::Etc::sourceparts=-)
              echo "::warning::default apt mirror failed a full attempt; retrying against canonical archive.ubuntu.com (runner apt config untouched)"
            fi
            # Budget bounds the wait below; a gate success (DNS observed
            # healthy) ALWAYS takes the next attempt, even in the budget's
            # final seconds — refusing a usable mirror would fail the job
            # unnecessarily. See the semantics note in the step header.
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::apt refresh+install failed after ${attempt} attempt(s) — ${APT_RETRY_BUDGET_SECONDS}s retry budget exhausted; failing the job"
              exit 1
            fi
            if ! apt_wait_for_dns; then
              echo "::error::apt refresh+install failed after ${attempt} attempt(s) — DNS/mirror outage outlasted the ${APT_RETRY_BUDGET_SECONDS}s retry budget; failing the job"
              exit 1
            fi
            echo "::warning::apt attempt ${attempt} failed (transient mirror/DNS failure); retrying"
            sleep 20
          done
      # anchor-cli 1.2.2's lockfile pins solana-sbpf 0.23.0, whose
      # aligned_memory.rs uses the UNSTABLE `Layout::dangling_ptr` core API
      # (feature `layout_for_ptr`). The pinned stable host toolchain
      # (1.91.1) rejects it — E0599 — so the CLI binary itself must be
      # compiled with nightly. This affects ONLY the anchor CLI install:
      # the on-chain build below still runs on platform-tools' embedded
      # toolchain, and every other job stays on stable 1.91.1.
      - name: Install nightly toolchain for anchor-cli
        run: rustup toolchain install nightly --profile minimal
      - name: Install Anchor CLI
        run: |
          cargo +nightly install --locked --version ${ANCHOR_VERSION} anchor-cli
          anchor --version
      # Phase 1 (build/reliability): enforce the pinned toolchain. This
      # script existed pre-Phase-1 but was never wired into CI — it verified
      # pins only when a developer remembered to run it locally. Here it has
      # all five tools available (see the setup-node/pnpm steps above) and
      # fails the job if solana/anchor/rust/node/pnpm drift from their pins.
      - name: Verify pinned toolchain versions
        run: bash scripts/check-toolchain.sh
      # Capture anchor build's full output to a file and upload it as a
      # workflow artifact when the job fails — needed because the actual
      # error message is otherwise only visible via the GitHub Actions
      # web UI logs page (the Composio integration this repo uses for
      # programmatic CI inspection does not expose log download).
      # Solana 3.0.10's bundled platform-tools v1.51 ships cargo 1.84,
      # which can't parse edition2024 manifests (blake3 0.12, hashbrown,
      # digest, crypto-common — all transitive deps of Anchor 1.2.2's SPL
      # deps), so CI installs the pinned v1.54 toolchain (cargo 1.89).
      # MECHANISM NOTE (CI ELF artifact discrepancy, resolved here): anchor
      # 1.2.2 passes `--tools-version v1.57` to cargo-build-sbf BY DEFAULT,
      # cargo-build-sbf 3.0.10 HONORS that flag (it is NOT silently ignored),
      # and it then downloads platform-tools v1.57 (rustc 1.95.0) into
      # ~/.cache/solana/v1.57 — silently bypassing a v1.51-directory-only
      # pin. cargo-build-sbf skips the download whenever the per-version
      # cache directory already exists and is non-empty (its
      # `install_if_missing`), so the pin below pre-seeds BOTH cache
      # directories cargo-build-sbf may resolve for this build — v1.51
      # (the cargo-build-sbf default) and v1.57 (anchor 1.2.2's default) —
      # with the exact same hash-verified v1.54 contents. The compiled
      # bytes then come from the pinned v1.54 toolchain (rustc 1.89.0-dev)
      # on every invocation path.
      - name: Pin platform-tools v1.54 (edition2024 fix + anchor tools-version override)
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/platform-tools.tar.bz2 \
            "https://github.com/anza-xyz/platform-tools/releases/download/v1.54/platform-tools-linux-x86_64.tar.bz2"
          # P5-07: the tarball is hash-pinned so the platform-tools toolchain
          # (which produces the deployed ELFs) cannot be swapped silently.
          echo "fcc41631c7f77561bf5412218bf297501dccf0305ea280f338f0ace2aab9f31e  /tmp/platform-tools.tar.bz2" | sha256sum -c -
          # Pre-seed every per-version cache directory cargo-build-sbf may
          # consult (see the mechanism note above). cargo-build-sbf skips
          # its own download when the directory exists and is non-empty.
          for CACHE_DEST in \
            "$HOME/.cache/solana/v1.51/platform-tools" \
            "$HOME/.cache/solana/v1.57/platform-tools"; do
            rm -rf "$CACHE_DEST"
            mkdir -p "$CACHE_DEST"
            tar xjf /tmp/platform-tools.tar.bz2 -C "$CACHE_DEST"
          done
          "$HOME/.cache/solana/v1.51/platform-tools/rust/bin/cargo" --version
          "$HOME/.cache/solana/v1.51/platform-tools/rust/bin/rustc" --version
      # Swatinem/rust-cache also caches target/, including
      # target/deploy/*-keypair.json keypairs auto-generated by an older
      # build: a pre-#80-era keypair (pubkey BYHDLsnRbaHA2hCdq5iL4Xkj5RXyZWMe3SDRHaYuHV4A)
      # survived in the cache and triggered a "Program ID mismatch" warning
      # on every later build. The keypair plays no role in the produced ELF
      # bytes (the program ID is the compiled-in declare_id!) and program
      # keypairs are owner-held outside git (Anchor.toml), so drop any
      # cached copy before building.
      - name: Drop cached program keypairs (not a build input)
        run: rm -f target/deploy/*-keypair.json
      # `anchor build` invokes `cargo-build-sbf` for the BPF compile AND
      # `anchor idl build` for IDL generation. The IDL step requires a
      # nightly Rust toolchain (the Anchor IDL-gen toolchain requirements
      # differ from this job's stable-only install). Since this workflow only installs stable, we run with
      # `--no-idl` and treat IDL generation as a follow-up workstream — it
      # produces TS client types but isn't a blocker for the on-chain
      # program. A later PR can add `dtolnay/rust-toolchain@nightly` plus
      # a dedicated IDL-build step.
      - name: Anchor build
        run: |
          set -o pipefail
          anchor build --no-idl 2>&1 | tee /tmp/anchor-build.log
      # DR-001/NS-2 fail-closed provenance gate: the uploaded artifact IS the
      # deployment input, so CI verifies the exact bytes before publishing
      # them. (1) The NS-3 program IDs must be structurally embedded in
      # allocated sections and no NS-1/NS-2 legacy ID bytes may be present
      # (the repo's structural ELF identity verifier). (2) The bytes must be
      # BYTE-IDENTICAL to the deployment-flow build of the same tree (plain
      # `cargo build-sbf`, arch v0, pinned v1.54 toolchain) — those digests
      # are the recorded deployment provenance (NS-3 rehearsal correction
      # report §8). They are byte-reproducible for a given tree:
      # cargo-build-sbf remaps the workspace cwd prefix and the only other
      # embedded paths are baked into the prebuilt platform-tools rlibs. ANY
      # source, dependency, toolchain or arch change shifts the digests — the
      # job then fails, and the new digests must be deliberately re-pinned
      # from a deploy_devnet.sh-flow rebuild before the artifact is trusted
      # for deployment.
      # CI-hang fix (runs 42460376811 + this PR's first run 42514819410/91):
      # the four commands below previously ran as ONE step. On 2026-11-08 the
      # step's process tree never terminated after the provenance checker
      # printed its success line — 5h56m of silence, then the 6-hour default
      # job window cancelled the run. Root cause (reproduced locally at the
      # baseline commit and re-observed on this very PR's first CI run):
      # node intermittently hangs in process teardown AFTER its final output
      # and process.exit() — the verification logic itself is synchronous
      # and completes in ~0.5s. On Linux, node writes stdout to a FILE
      # synchronously, so the hardening below makes each tool's VERDICT
      # durable on disk and decides the STEP on the recorded verdict, never
      # on the process's ability to die:
      #   1. one command = one step, so a future hang names the exact
      #      command and every command's completion is separately recorded;
      #   2. each node tool runs under `timeout --kill-after=10s` with its
      #      output captured to a per-run log that is printed verbatim; the
      #      step passes ONLY on the tool's own recorded success verdict
      #      ("OK <label>: STRUCTURAL" / "PROVENANCE OK") and fails CLOSED
      #      on anything else — a missing verdict is a failed gate. The
      #      accepted exit statuses are likewise explicit (PR #95 review):
      #      rc=0 (clean exit) or rc=124 (the bounded timeout fired), in
      #      both cases WITH the verdict already recorded — every other
      #      return code fails closed. A bound breach can therefore never
      #      mask a failed verification;
      #   3. the job-level timeout-minutes above caps the worst case.
      - name: Install devnet-tools for the provenance gate (pnpm, frozen lockfile)
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --filter @graveyield/devnet-tools
      - name: Verify structural ELF identity (ns3_verify_elf)
        run: |
          set -euo pipefail
          set +e
          timeout --kill-after=10s 300 \
            node scripts/devnet/ns3_verify_elf.mjs \
            --scanner-so target/deploy/grave_scanner.so \
            --vault-so target/deploy/grave_vault.so \
            --scanner-id EFJpKtWx5gDnc4Hh6GEEgPLUrPh377E4Nfic8jsJAQJL \
            --vault-id 7VxUGJNgi1bZ8x4rTtLBNdgLs9sCLmUTpVE3on1nshya \
            > /tmp/ns3_verify_elf.log 2>&1
          rc=$?
          set -e
          cat /tmp/ns3_verify_elf.log
          # Exit-status rule (PR #95 review tightening): the ONLY accepted
          # outcomes are rc=0 (clean exit) and rc=124 (GNU timeout fired) —
          # and for BOTH, the verdicts above must already be recorded. Any
          # other return code fails closed; rc=0 without both verdicts also
          # fails closed.
          if [[ $rc -ne 0 && $rc -ne 124 ]]; then
            echo "ns3_verify_elf rc=$rc is neither 0 nor the GNU-timeout status 124 — failing closed"
            exit "$rc"
          fi
          if grep -q "^OK scanner: STRUCTURAL" /tmp/ns3_verify_elf.log && \
             grep -q "^OK vault: STRUCTURAL" /tmp/ns3_verify_elf.log; then
            if [[ $rc -ne 0 ]]; then
              echo "NOTE: both structural verdicts were recorded; rc=124 is the bounded timeout terminating the known node teardown hang (PR #95 RCA) — recorded verdicts stand."
            fi
            exit 0
          fi
          echo "structural identity verdicts not both recorded (rc=$rc) — failing closed"
          exit 1
      # Shared fail-closed provenance gate (single source of the digests:
      # scripts/devnet/provenance.manifest.json, the same manifest the
      # deployment flow enforces in deploy_devnet.sh). Verifies the ELF
      # digests, the SBPF v0 target architecture (e_machine 263 /
      # e_flags 0), and — using the tarball this job downloaded and
      # pre-seeded above — the platform-tools toolchain integrity.
      # ANY digest/arch/toolchain drift fails the job; digests are
      # re-pinned only after an independently reviewed rebuild.
      - name: Verify ELF deployment provenance (fail-closed gate)
        run: |
          set -euo pipefail
          set +e
          timeout --kill-after=10s 300 \
            node scripts/devnet/ns3_check_provenance.mjs \
            --scanner-so target/deploy/grave_scanner.so \
            --vault-so target/deploy/grave_vault.so \
            --scanner-id EFJpKtWx5gDnc4Hh6GEEgPLUrPh377E4Nfic8jsJAQJL \
            --vault-id 7VxUGJNgi1bZ8x4rTtLBNdgLs9sCLmUTpVE3on1nshya \
            --platform-tools-tarball /tmp/platform-tools.tar.bz2 \
            > /tmp/ns3_check_provenance.log 2>&1
          rc=$?
          set -e
          cat /tmp/ns3_check_provenance.log
          # Exit-status rule (PR #95 review tightening): the ONLY accepted
          # outcomes are rc=0 (clean exit) and rc=124 (GNU timeout fired) —
          # and for BOTH, "PROVENANCE OK" above must already be recorded.
          # Any other return code fails closed; rc=0 without the verdict
          # also fails closed.
          if [[ $rc -ne 0 && $rc -ne 124 ]]; then
            echo "ns3_check_provenance rc=$rc is neither 0 nor the GNU-timeout status 124 — failing closed"
            exit "$rc"
          fi
          if grep -q "^PROVENANCE OK" /tmp/ns3_check_provenance.log; then
            if [[ $rc -ne 0 ]]; then
              echo "NOTE: PROVENANCE OK was recorded; rc=124 is the bounded timeout terminating the known node teardown hang (PR #95 RCA) — the recorded verdict stands."
            fi
            exit 0
          fi
          echo "provenance gate did not record PROVENANCE OK (rc=$rc) — failing closed"
          exit 1
      - name: Print ELF SHA-256 checksums (diagnostic, bounded)
        run: |
          set -euo pipefail
          timeout --kill-after=10s 120 sha256sum target/deploy/*.so
      - name: Upload program ELFs (deployment-provenance artifacts)
        # DR-001/NS-2: the fresh devnet deployment consumes the ELFs built by
        # THIS job, so the deployed bytes come from exactly the CI-pinned
        # toolchain (the baseline report's "CI-equivalent pinned toolchain"
        # provenance requirement, made reproducible by uploading the
        # artifacts instead of rebuilding outside CI). The provenance
        # verification step above gates the bytes this uploads.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: program-elfs
          path: target/deploy/*.so
          if-no-files-found: error
          retention-days: 7
      - name: Upload anchor build log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anchor-build-log
          path: /tmp/anchor-build.log
          if-no-files-found: warn
          retention-days: 7

  ts-typecheck:
    name: pnpm typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm/action-setup@v6 requires Node.js to already be installed
      # (upstream removed the bundled Node in v6). setup-node MUST come
      # first. The previous floating-tag failure at install time was this
      # ordering, not a regression in v6.0.7/v6.0.8.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # pnpm/action-setup@v6 auto-detects pnpm version from the
      # `packageManager` field in package.json (pnpm@9.12.0). No explicit
      # `version:` input — that field is what we want to be the single
      # source of truth for the pnpm pin anyway.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # pnpm-lock.yaml IS committed at the repo root, so the install is
      # frozen (reproducible builds). If you intentionally bump deps,
      # regenerate the lockfile in the same PR.
      # The `cache: pnpm` input on setup-node is still unused: it needs a
      # well-formed lockfile hash and buys little here since pnpm's own
      # store cache dominates. Revisit if install times regress.
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck

  # Phase 1 (build/reliability): the TS workspaces previously had no lint or
  # format gate (Rust had cargo fmt/clippy since the baseline). This job makes
  # the eslint + prettier toolchain merge-blocking for sdk/indexer/ops/adversary.
  ts-lint:
    name: ts lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm fmt:ts:check

  terminology-lint:
    name: terminology lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Forbidden vocabulary check
        run: bash scripts/terminology-lint.sh

  doc-links-lint:
    name: doc link integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Relative markdown link check
        run: bash scripts/doc-links-lint.sh
