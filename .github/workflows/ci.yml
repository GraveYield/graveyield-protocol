name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly run so the sdk-sync drift check also fires when ONLY the
  # vendored copy in GraveYield/salvor-bots changes (a push there cannot
  # trigger this workflow). See the sdk-sync-check job below.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Aligned with the official Solana 3.x stack:
  # https://solana.com/docs/intro/installation
  SOLANA_VERSION: 3.0.10
  ANCHOR_VERSION: 0.32.1
  # Host toolchain. Must match rust-toolchain.toml.
  RUST_TOOLCHAIN: 1.91.1
  NODE_VERSION: 24
  PNPM_VERSION: 9

jobs:
  rust-fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust-clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  # Baseline audit (Phase 0, blocker B4 / NS-5): the repo had 668 passing
  # host/TS tests locally but CI gated on ZERO of them — fmt, clippy,
  # anchor build and typecheck only. These two jobs make the existing
  # suites merge-blocking. The fork harness (47+ tests, needs cargo
  # build-sbf + multi-MB mainnet fixtures) lives in fork-harness.yml.
  rust-host-tests:
    name: cargo test (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: grave-scanner (lib)
        run: cargo test -p grave-scanner --lib
      - name: grave-vault (lib)
        run: cargo test -p grave-vault --lib
      - name: grave-snapshotter (lib + integration)
        run: cargo test -p grave-snapshotter

  ts-build-and-test:
    name: pnpm build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Ordering note: setup-node MUST come before pnpm/action-setup@v6
      # (see ts-typecheck below).
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # Includes the SDK's live-devnet smoke tests: read-only RPC calls
      # against public devnet, no keys required. If devnet itself is
      # degraded the job fails — treat that as a real operational signal,
      # not flake (the SDK refuses to ship untested against the cluster).
      - run: pnpm -r test

  # NS-4 (baseline blocker B3): the shared salvor SDK used to live in two
  # copies that drifted silently (FLEET-M0 audit F1/F5/F7 — priority-fee
  # unit mismatch, launch-price inversion, base58-vs-byte snapshot sort),
  # with the fixes stranded only in the salvor-bots copy. sdk/src/ is now
  # the single source of truth; salvor-bots/src/ is a vendored mirror.
  # This job fails on ANY divergence. Both repos are public, so a token
  # is not required to read salvor-bots. The weekly cron on this workflow
  # additionally catches salvor-side-only edits: a push to GraveYield/
  # salvor-bots cannot trigger this workflow, so without the schedule the
  # mirror could drift for weeks unnoticed.
  sdk-sync-check:
    name: sdk sync (salvor-bots mirror)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: GraveYield/salvor-bots
          ref: main
          path: _salvor-bots
      - name: Fail on any SDK divergence
        run: |
          set -euo pipefail
          echo "Enforcing byte-equality of the shared SDK modules:"
          echo "  graveyield-protocol/sdk/src  (single source of truth)"
          echo "  salvor-bots/src              (vendored mirror)"
          diff -r sdk/src _salvor-bots/src
          echo "in sync: sdk/src == salvor-bots/src (policy: sdk/README.md)"

  anchor-build:
    name: anchor build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      # Node + pnpm are installed here (not because anchor needs them) so
      # that scripts/check-toolchain.sh below can verify ALL five pinned
      # toolchains — solana, anchor, rust, node, pnpm — in the single job
      # where the Rust/Solana side is actually present. Without these two
      # steps the toolchain check would fail on the missing JS side; with
      # them, a drift in ANY pin (rust-toolchain.toml, packageManager,
      # NODE_VERSION, SOLANA_VERSION, ANCHOR_VERSION) fails this job.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v6
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      # cargo-binstall was the original choice for speed but silently
      # no-ops on anchor-cli 0.32.x: it exits 0 without installing the
      # `anchor` binary on PATH (verified across multiple CI runs — the
      # Install Anchor CLI step reports 0 seconds and success, then
      # `anchor build` exits in 1 second with "command not found").
      # cargo install --locked compiles from source (~5-7 min cold, cached
      # by Swatinem/rust-cache@v2) and reliably places `anchor` in
      # ~/.cargo/bin. The trailing `anchor --version` is a load-bearing
      # assertion so future install regressions fail here rather than
      # leaking to the build step where the symptom is opaque.
      # Install system libraries needed by `anchor-cli` 0.32.1's transitive
      # build deps before `cargo install` recompiles them from source.
      # `hidapi 2.6.3` (pulled in via anchor-cli → solana-cli →
      # solana-remote-wallet) runs `pkg-config --libs --cflags libudev` from
      # its build.rs and panics with "could not find system library 'libudev'
      # required by the 'hidapi' crate" when the dev headers are missing.
      # The GitHub-hosted `ubuntu-latest` image ships `libudev1` (runtime) but
      # NOT `libudev-dev` (headers), so a fresh build from source fails. When
      # `Swatinem/rust-cache@v2` has a warm anchor-cli binary the build is
      # skipped and the missing headers are masked — that's why some past runs
      # passed. The cold path (PRs from forks, cache key rotation, weekly
      # cache eviction) reliably reproduces the failure seen in run
      # 37252277928. Install `libudev-dev` (and `libhidapi-dev` as a defensive
      # measure against future hidapi version bumps that may also probe for
      # the hidapi system library) before compiling anchor-cli.
      - name: Install system libraries for anchor-cli build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev libhidapi-dev
      - name: Install Anchor CLI
        run: |
          cargo install --locked --version ${ANCHOR_VERSION} anchor-cli
          anchor --version
      # Phase 1 (build/reliability): enforce the pinned toolchain. This
      # script existed pre-Phase-1 but was never wired into CI — it verified
      # pins only when a developer remembered to run it locally. Here it has
      # all five tools available (see the setup-node/pnpm steps above) and
      # fails the job if solana/anchor/rust/node/pnpm drift from their pins.
      - name: Verify pinned toolchain versions
        run: bash scripts/check-toolchain.sh
      # Capture anchor build's full output to a file and upload it as a
      # workflow artifact when the job fails — needed because the actual
      # error message is otherwise only visible via the GitHub Actions
      # web UI logs page (the Composio integration this repo uses for
      # programmatic CI inspection does not expose log download).
      # Solana 3.0.10's bundled platform-tools v1.51 ships cargo 1.84,
      # which can't parse edition2024 manifests (blake3 0.12, hashbrown,
      # digest, crypto-common — all transitive deps of Anchor 0.32.1's SPL
      # deps). cargo-build-sbf 3.0.10's `--tools-version` flag is silently
      # ignored, and `[workspace.metadata.solana] tools-version = "v1.54"`
      # isn't honored either, so we replace the cached platform-tools
      # directory with v1.54 contents (cargo 1.89) before `anchor build`
      # invokes cargo-build-sbf. The cache key stays `v1.51` because
      # cargo-build-sbf 3.0.10 hardcodes it.
      - name: Pin platform-tools v1.54 (edition2024 fix)
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/platform-tools.tar.bz2 \
            "https://github.com/anza-xyz/platform-tools/releases/download/v1.54/platform-tools-linux-x86_64.tar.bz2"
          CACHE_DEST="$HOME/.cache/solana/v1.51/platform-tools"
          rm -rf "$CACHE_DEST"
          mkdir -p "$CACHE_DEST"
          tar xjf /tmp/platform-tools.tar.bz2 -C "$CACHE_DEST"
          "$CACHE_DEST/rust/bin/cargo" --version
          "$CACHE_DEST/rust/bin/rustc" --version
      # `anchor build` invokes `cargo-build-sbf` for the BPF compile AND
      # `anchor idl build` for IDL generation. The IDL step requires a
      # nightly Rust toolchain (Anchor 0.32.1 hasn't migrated to stable IDL
      # gen yet). Since this workflow only installs stable, we run with
      # `--no-idl` and treat IDL generation as a follow-up workstream — it
      # produces TS client types but isn't a blocker for the on-chain
      # program. A later PR can add `dtolnay/rust-toolchain@nightly` plus
      # a dedicated IDL-build step.
      - name: Anchor build
        run: |
          set -o pipefail
          anchor build --no-idl 2>&1 | tee /tmp/anchor-build.log
      - name: Upload anchor build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: anchor-build-log
          path: /tmp/anchor-build.log
          if-no-files-found: warn
          retention-days: 7

  ts-typecheck:
    name: pnpm typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm/action-setup@v6 requires Node.js to already be installed
      # (upstream removed the bundled Node in v6). setup-node MUST come
      # first. The previous floating-tag failure at install time was this
      # ordering, not a regression in v6.0.7/v6.0.8.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # pnpm/action-setup@v6 auto-detects pnpm version from the
      # `packageManager` field in package.json (pnpm@9.12.0). No explicit
      # `version:` input — that field is what we want to be the single
      # source of truth for the pnpm pin anyway.
      - uses: pnpm/action-setup@v6
      # pnpm-lock.yaml IS committed at the repo root, so the install is
      # frozen (reproducible builds). If you intentionally bump deps,
      # regenerate the lockfile in the same PR.
      # The `cache: pnpm` input on setup-node is still unused: it needs a
      # well-formed lockfile hash and buys little here since pnpm's own
      # store cache dominates. Revisit if install times regress.
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck

  # Phase 1 (build/reliability): the TS workspaces previously had no lint or
  # format gate (Rust had cargo fmt/clippy since the baseline). This job makes
  # the eslint + prettier toolchain merge-blocking for sdk/indexer/ops/adversary.
  ts-lint:
    name: ts lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm fmt:ts:check

  terminology-lint:
    name: terminology lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Forbidden vocabulary check
        run: bash scripts/terminology-lint.sh

  doc-links-lint:
    name: doc link integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Relative markdown link check
        run: bash scripts/doc-links-lint.sh
