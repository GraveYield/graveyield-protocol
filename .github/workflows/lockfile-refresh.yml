name: lockfile-refresh

# Manual cargo-lockfile maintenance for Dependabot alerts that are fixed
# by a lockfile-only update. The engineering sandbox has no Rust
# toolchain, so this job runs `cargo update` where the toolchain exists,
# captures inverted-tree evidence for the consumers that pin vulnerable
# majors, and uploads both. The resulting Cargo.lock is committed and
# validated by the normal CI (fmt, clippy, tests, anchor build) like any
# other change — no auto-commit from CI.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-lockfile:
    name: cargo update + dependency evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head, pinned 2026-11-01
        with:
          toolchain: 1.91.1
      # One invocation per crate so a blocked bump (semver-incompatible
      # consumer) does not prevent the others from landing.
      - name: cargo update (semver-compatible precise bumps)
        run: |
          cargo update -p rustls-webpki --precise 0.103.13 || echo "rustls-webpki update blocked (see evidence)"
          cargo update -p curve25519-dalek --precise 4.1.3 || echo "curve25519-dalek update blocked (see evidence)"
      - name: evidence for consumers that pin vulnerable majors
        run: |
          {
            # Several crates coexist in multiple majors (e.g. rustls-webpki
            # 0.101.7 + 0.103.15), so `cargo tree -i <name>` is ambiguous.
            # Enumerate every locked version and qualify the spec.
            for c in ed25519-dalek rand atty rustls-webpki curve25519-dalek; do
              for v in $(grep -A1 "^name = \"$c\"$" Cargo.lock | grep '^version' | sed 's/version = "\(.*\)"/\1/'); do
                echo "=== cargo tree -i $c@$v ==="
                cargo tree -i "$c@$v" || true
              done
            done
          } > cargo-tree-evidence.txt 2>&1
          cat cargo-tree-evidence.txt
      - name: lockfile sanity (metadata resolves against the lock)
        run: cargo metadata --locked --format-version 1 > /dev/null && echo "lockfile consistent"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cargo-lockfile-refresh
          path: |
            Cargo.lock
            cargo-tree-evidence.txt
          if-no-files-found: error
