# fork-harness.yml — the seven solana-program-test fork suites under
# programs/grave-vault/tests/.
#
# Baseline audit (Phase 0, blocker B4 / NS-5): the fork suites are the ONLY
# tests that exercise the programs against REAL mainnet state (Raydium V4
# AmmInfo/MarketState layouts, Jupiter v6 routing, scanner windows), yet
# pre-audit they were compile-validated at best — never run in CI, and the
# CHANGELOG admits the post-rollback suites were only build-checked.
#
# Trigger policy (P5-04, Stage B; fail-closed closeout correction
# 2026-11-02):
#   - nightly cron (03:00 UTC, off-peak) — the catch-all
#   - workflow_dispatch (manual runs)
#   - pull_request runs AUTOMATICALLY when the diff touches fork-relevant
#     paths (programs/**, snapshotter/**, sdk/**, workspace manifests,
#     rust-toolchain.toml, Anchor.toml, the harness scripts, the
#     classifier script, this workflow)
#   - the `fork-harness` label remains a manual escape hatch for ANY PR
#     (including docs-only changes), preserved from the pre-Stage-B policy
#
# The path/label decision is made by a cheap `changes` job whose
# classification logic lives in scripts/classify_fork_changes.sh and is
# FAIL-CLOSED: a failed diff, a missing/unresolvable base reference, an
# empty diff, or a MATCHING-TOOL failure (grep error — only a clean exit
# 1 counts as "no match") all classify as "run". The previous inline filter used
# `git diff ... || true`, whose failure mode was FAIL-OPEN — a failed diff
# could silently skip the fork suites on a code PR (Phase 5.1 post-merge
# closeout audit finding, corrected 2026-11-02). The heavy job's condition
# skips the harness ONLY on an explicit "skip" from a successful
# classification; a failed or missing classification runs it. A skipped
# fork run remains VISIBLE as a skipped job (a docs-only PR never pays the
# build-sbf + fixture cost, and a reviewer can see the harness was
# deliberately not run rather than silently absent).
#
# The heavy work is `scripts/build_fork_harness.sh`: build both programs +
# the Jupiter v6 stub with cargo build-sbf, fetch real mainnet fixtures
# (several MB, intentionally gitignored), then run all seven suites.
# Fixture fetches hit the public mainnet RPC; override with the
# FORK_FIXTURES_RPC_URL secret if the default endpoint rate-limits.
#
# A cheap regression gate runs BEFORE that heavy work so a broken helper
# fails early: programs/grave-vault/tests/fork_support_regression.rs pins
# the suites' skip-integrity contract, and
# scripts/build_fork_harness_verifier_test.mjs pins the fail-closed
# fixture-verifier scenarios. A failure in either aborts the job before
# any build-sbf or fixture fetching is paid for.

name: fork-harness

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  pull_request:
    # opened/reopened/synchronize drive the automatic path filter; `labeled`
    # keeps the manual escape hatch for PRs the path filter excludes.
    types: [opened, synchronize, reopened, labeled]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fork-harness-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: 3.0.10
  RUST_TOOLCHAIN: 1.91.1
  NODE_VERSION: 24

jobs:
  changes:
    name: detect fork-relevant changes
    runs-on: ubuntu-latest
    outputs:
      # Fail-closed: only the literal "skip" suppresses the heavy job. An
      # empty/missing classification (failed step) defaults to "run".
      fork_relevant: ${{ steps.filter.outputs.fork_relevant || 'run' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so the base sha is always present
      - id: filter
        name: classify fork-relevant changes (fail-closed)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # scripts/classify_fork_changes.sh prints exactly "run" or
          # "skip" and exits 0; every failure mode inside it (failed diff,
          # missing base, empty diff, matching-tool error) classifies as
          # "run" — fail-closed.
          # Fixture-tested by scripts/classify_fork_changes_test.sh (23
          # scenarios, incl. grep-error fail-closed).
          result="$(bash scripts/classify_fork_changes.sh "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA")"
          echo "classification: $result"
          echo "fork_relevant=$result" >> "$GITHUB_OUTPUT"

  fork-harness:
    name: build + fetch + run 7 fork suites
    needs: changes
    # Run unless the classification EXPLICITLY said "skip" on a successful
    # changes job, or the PR carries the manual `fork-harness` label
    # (escape hatch). Schedule/dispatch always run. Fail-closed: a failed
    # changes job (needs.changes.result != 'success') or an empty output
    # (already defaulted to 'run' in the outputs block) RUNS the harness
    # instead of skipping it. always() + !cancelled() let this job's
    # condition evaluate when the changes job failed, while still honoring
    # a user cancellation.
    if: >-
      always() && !cancelled() &&
      (
        needs.changes.outputs.fork_relevant != 'skip' ||
        needs.changes.result != 'success' ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'fork-harness'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head, pinned 2026-11-01
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      # Same hidapi/libudev requirement as anchor-build in ci.yml: anchor
      # 1.2.2's transitive deps probe for libudev headers when compiling
      # from source. cargo-build-sbf needs the same system libs on cold
      # cache, and the fork suites link solana-program-test which builds
      # parts of the Solana stack natively.
      - name: Install system libraries
        run: |
          set -euo pipefail
          # Same two-tier retry discipline as ci.yml's "Install system
          # libraries for anchor-cli build" (incidents: run 43036634800 —
          # ~6 min of azure.archive.ubuntu.com DNS failure, exit 100 on a
          # single-shot apt-get; run 43043702834 — the same mirror
          # unreachable for the whole 45-minute job budget while retries
          # kept running). Bounded fail-closed retries with escalating
          # backoff; after the first full attempt fails, later attempts go
          # through the canonical mirrors (archive.ubuntu.com /
          # security.ubuntu.com) via a standalone temporary source list —
          # the runner's apt config is never mutated. Exhaustion still
          # fails the job (fail-closed).
          APT_SRC_OPTS=()
          for attempt in 1 2 3 4 5 6; do
            echo "::notice::apt refresh+install attempt ${attempt}/6"
            if sudo apt-get "${APT_SRC_OPTS[@]}" -o Acquire::Retries=3 update \
              && sudo apt-get "${APT_SRC_OPTS[@]}" -o Acquire::Retries=3 install -y --no-install-recommends libudev-dev libhidapi-dev
            then
              break
            fi
            if [ "$attempt" = 6 ]; then
              echo "::error::apt refresh+install failed after 6 attempts — Ubuntu mirrors stayed unreachable (DNS/fetch transient); failing the job"
              exit 1
            fi
            if [ "$attempt" = 1 ]; then
              . /etc/os-release
              CANONICAL_SOURCES="$(mktemp)"
              printf '%s\n' \
                "deb http://archive.ubuntu.com/ubuntu/ ${VERSION_CODENAME} main restricted universe multiverse" \
                "deb http://archive.ubuntu.com/ubuntu/ ${VERSION_CODENAME}-updates main restricted universe multiverse" \
                "deb http://security.ubuntu.com/ubuntu/ ${VERSION_CODENAME}-security main restricted universe multiverse" \
                > "$CANONICAL_SOURCES"
              APT_SRC_OPTS=(-o "Dir::Etc::sourcelist=$CANONICAL_SOURCES" -o Dir::Etc::sourceparts=-)
              echo "::warning::default apt mirror failed a full attempt; retrying against canonical archive.ubuntu.com (runner apt config untouched)"
            else
              echo "::warning::apt attempt ${attempt} failed (transient mirror/DNS failure); retrying in $((attempt * 20))s"
            fi
            sleep "$((attempt * 20))"
          done
      # Solana 3.0.10's bundled platform-tools v1.51 ships cargo 1.84,
      # which can't parse edition2024 manifests (blake3 0.12 et al.).
      # Replace the cached platform-tools with v1.54 contents exactly as
      # ci.yml's anchor-build does — see the rationale block there.
      - name: Pin platform-tools v1.54 (edition2024 fix)
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/platform-tools.tar.bz2 \
            "https://github.com/anza-xyz/platform-tools/releases/download/v1.54/platform-tools-linux-x86_64.tar.bz2"
          # P5-07: the tarball is hash-pinned so the platform-tools toolchain
          # (which produces the deployed ELFs) cannot be swapped silently.
          echo "fcc41631c7f77561bf5412218bf297501dccf0305ea280f338f0ace2aab9f31e  /tmp/platform-tools.tar.bz2" | sha256sum -c -
          CACHE_DEST="$HOME/.cache/solana/v1.51/platform-tools"
          rm -rf "$CACHE_DEST"
          mkdir -p "$CACHE_DEST"
          tar xjf /tmp/platform-tools.tar.bz2 -C "$CACHE_DEST"
          "$CACHE_DEST/rust/bin/cargo" --version
          "$CACHE_DEST/rust/bin/rustc" --version
      # Cheap regression gate before the expensive harness work: the
      # fork_support skip-integrity contract (host-built, no fixtures or
      # network needed — absence handling uses isolated temp dirs) and the
      # harness verifier's fail-closed scenarios. Either failure aborts the
      # job here, before any cargo-build-sbf or fixture fetching is paid.
      - name: Regression gate (fork_support helper + harness verifier)
        run: |
          set -euo pipefail
          cargo test -p grave-vault --test fork_support_regression
          node scripts/build_fork_harness_verifier_test.mjs
      - name: Build harness, fetch fixtures, run all fork suites
        env:
          # Public mainnet RPC by default; point the optional repo secret
          # FORK_FIXTURES_RPC_URL at a dedicated endpoint if needed.
          RPC_URL: ${{ secrets.FORK_FIXTURES_RPC_URL || 'https://api.mainnet-beta.solana.com' }}
        run: |
          set -o pipefail
          bash scripts/build_fork_harness.sh 2>&1 | tee /tmp/fork-harness.log
      - name: Upload harness log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-harness-log
          path: /tmp/fork-harness.log
          if-no-files-found: warn
          retention-days: 7
