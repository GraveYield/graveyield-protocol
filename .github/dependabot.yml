version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "rust"]
    # The on-chain stack is a pinned platform, not a rolling target: the
    # programs build against anchor-lang 1.2.2 (whose solana-* 3.1.x
    # transitive tree the whole SDK/indexer/ops surface mirrors — crate,
    # anchor-cli, Anchor.toml and the docs all cite the same number), and
    # CI pins SOLANA_VERSION 3.0.10 / ANCHOR_VERSION 1.2.2. The 3.1.x
    # client line carries tokio-tungstenite 0.28 / rustls 0.23, closing
    # Dependabot alerts #9-#11 (the 2.3 line's tungstenite 0.20 was the
    # last rustls-0.21 carrier). Anchor 2.x is in release-candidate and
    # solana-* 4.x+ are a further platform move — those majors cannot be
    # adopted piecemeal by a Dependabot bump. Ignore them here and migrate
    # deliberately instead. Solana 3.x patch/minor bumps keep flowing.
    #
    # anchor-* ignores are NOT limited to majors: even a patch can break
    # the platform's lockstep. Dependabot re-locks one crate at a time —
    # the anchor-lang 0.32.2 bump (PR #45) left anchor-spl at 0.32.1
    # compiled against a 0.32.2 macro layer, and the crate drifted from
    # anchor-cli and Anchor.toml. Ignore the whole family until the next
    # deliberate migration.
    #
    # sha2 is pinned for the same class of reason, stated precisely (P5-02,
    # Stage B investigation): the deployed ELFs contain NO sha2 crate — the
    # on-chain SHA-256 is the runtime `sol_sha256` syscall (verified by
    # cargo-tree reachability + the ELF's single syscall import). Host-side,
    # three sha2 instances exist in the lock (0.9.9 / 0.10.9 / 0.11.1):
    # 0.10.9 is the only reachable instance that matters — the snapshotter's
    # direct dependency (the off-chain Merkle producer) MUST reuse the SAME
    # lockfile instance the host-test hasher resolves, because the
    # byte-identity is test-pinned against `grave_vault::merkle` and the
    # fork claim tests prove the syscall accepts 0.10.9-produced roots
    # end-to-end. 0.9.9 is not reachable from any crate's normal
    # (artifact-producing) graph — it enters only through the
    # solana-program-test dev-dependency chain in host test binaries.
    # CORRECTED 2026-11-02 (P5-02 closeout re-verification, Stage B log
    # §2.5 addendum): the 0.11.1 carriers ARE reachable — k256 (via
    # solana-sdk → solana-program → solana-secp256k1-recover) and
    # solana-ed25519 (via solana-client → solana-signature) resolve 0.11.1
    # in the snapshotter's normal host graph (compiled into the snapshotter
    # host binary's signature/RPC machinery, not the Merkle producer path);
    # scanner/vault carry 0.11.1 via anchor-syn proc-macros only. Graph
    # reachability is not evidence of runtime execution, and the on-chain
    # ELFs contain no sha2 crate — a multi-instance tree remains a hygiene
    # observation, not a crypto-core split. Dependabot files a
    # 0.x minor (0.10 -> 0.11) as a semver-major, so the major rule covers
    # it; 0.10.x patches keep flowing.
    ignore:
      - dependency-name: "anchor-*"
      - dependency-name: "sha2"
        update-types: ["version-update:semver-major"]
      - dependency-name: "solana-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "agave-*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "typescript"]
    # Pin Node typings to the major matching engines.node (24 LTS).
    # Bumping @types/node above the engines major causes typecheck to fail
    # against APIs that don't exist on the runtime. When the engines major is
    # raised, update this allow-list at the same time.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/bn.js"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native (Go) rewrite with a different config
      # surface; the workspace's tsconfig/tsc-based typecheck gates target
      # the 5.x line. Migrate deliberately, not via a Dependabot bump.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
