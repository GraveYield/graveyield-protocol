[toolchain]
# Aligned with the official Solana 3.x stack (per
# https://solana.com/docs/intro/installation). anchor 1.2.2 is the Anchor
# line built against the agave solana-* 3.1.x crates (closing the
# tokio-tungstenite 0.20 / rustls 0.21 transitive exposure).
anchor_version = "1.2.2"
solana_version = "3.0.10"

[features]
resolution = true
skip-lint = false

# Program IDs. On devnet these are real keypairs deployed per docs/DEVNET.md
# (the devnet keypairs are throwaways — never reuse them for mainnet). The
# mainnet deployment generates fresh keypairs under custody and syncs them
# here and into the `declare_id!` calls in lib.rs (KEYS-003).
[programs.localnet]
grave_scanner = "CuQZesHk8eHvaoNTFiTr1hUjfVKGCqDZHTTe8HkJAo54"
grave_vault   = "Bd5smhQgMrvcRw9j659MNTKySpBJsKZLBKtinCAGs7rg"

[programs.devnet]
grave_scanner = "CuQZesHk8eHvaoNTFiTr1hUjfVKGCqDZHTTe8HkJAo54"
grave_vault   = "Bd5smhQgMrvcRw9j659MNTKySpBJsKZLBKtinCAGs7rg"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 'tests/**/*.ts'"

[test.validator]
url = "https://api.mainnet-beta.solana.com"

[[test.validator.clone]]
# Raydium V4 program (cloned from mainnet for fork tests).
address = "675kPX9MHTjS2zt1qfr1NYHuzeLXfQM9H24wFSUt1Mp8"
