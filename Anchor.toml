[toolchain]
# Aligned with the official Solana 3.x stack (per
# https://solana.com/docs/intro/installation). anchor 1.2.2 is the Anchor
# line built against the agave solana-* 3.1.x crates (closing the
# tokio-tungstenite 0.20 / rustls 0.21 transitive exposure).
anchor_version = "1.2.2"
solana_version = "3.0.10"

[features]
resolution = true
skip-lint = false

# Program IDs. NS-3 devnet deployment (DR-002): owner-generated, owner-held
# program keypairs held outside git in the owner's custody. Deployment and
# on-chain acceptance are PENDING — until the owner executes the NS-3
# deployment recorded in docs/DEVNET.md, build and test against localnet.
# The NS-2 deployment (CuQZes…Ao54 / Bd5smh…s7rg) and the NS-1 frozen static
# reference (5JiCV…zvNF / HUyoG5…ox3v6) are preserved in
# docs/LEGACY_DEPLOYMENTS.md. Mainnet ships with fresh keypairs under
# custody synced here and into the `declare_id!` calls in lib.rs (KEYS-003).
[programs.localnet]
grave_scanner = "EFJpKtWx5gDnc4Hh6GEEgPLUrPh377E4Nfic8jsJAQJL"
grave_vault   = "7VxUGJNgi1bZ8x4rTtLBNdgLs9sCLmUTpVE3on1nshya"

[programs.devnet]
grave_scanner = "EFJpKtWx5gDnc4Hh6GEEgPLUrPh377E4Nfic8jsJAQJL"
grave_vault   = "7VxUGJNgi1bZ8x4rTtLBNdgLs9sCLmUTpVE3on1nshya"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 'tests/**/*.ts'"

[test.validator]
url = "https://api.mainnet-beta.solana.com"

[[test.validator.clone]]
# Raydium V4 program (cloned from mainnet for fork tests).
address = "675kPX9MHTjS2zt1qfr1NYHuzeLXfQM9H24wFSUt1Mp8"
