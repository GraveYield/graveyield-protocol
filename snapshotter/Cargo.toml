[package]
name = "grave-snapshotter"
description = "GraveYield off-chain LP-holder snapshotter: deterministic, invariant-checked enumeration and attribution of the LP-holder set, plus the Merkle tree / proof generator and the sealed snapshot artifact that feed the claim-side root (Phases 5.1 + 5.2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[lib]
name = "grave_snapshotter"

[dependencies]
# Blocking JSON-RPC client for the enumeration source. The 3.1 line is
# aligned with the solana-program 3.1.x transitively pulled by anchor-lang
# 1.2.2 (see Cargo.lock), and its pubsub client uses tokio-tungstenite
# 0.28 / rustls 0.23 — the 2.3 line's tungstenite 0.20 was the last
# rustls-0.21 carrier in the tree (Dependabot alerts #9-#11).
solana-client = "3.1"
# solana-sdk stays on the "3" facade (3.0.0; there is no 3.1.x facade
# release) — its caret component reqs resolve the SAME 3.1.x instances
# solana-client 3.1.x uses.
solana-sdk = "3"
# CommitmentConfig lives in its standalone crate in the agave split-crate
# era (no longer re-exported through the solana-sdk facade); resolved on
# the same 3.1.x train as solana-client.
solana-commitment-config = "3.1"
# `UiAccountEncoding` (rpc_config's encoding field) is not re-exported
# through solana-client — it comes from this types crate, resolved on the
# same 3.1.x train as solana-client.
solana-account-decoder-client-types = "3.1"
# Canonical SHA-256 for the leaf/parent hashing (Phase 5.2). Pure-Rust
# backend, byte-identical to the on-chain `solana_sha256_hasher::hash`
# path — the equality is pinned by tests against
# `grave_vault::merkle::{compute_leaf, verify_proof}`. Version already
# resolved in Cargo.lock (the on-chain hasher's `sha2` feature uses it).
# Pinned to the 0.10 line deliberately: that is the version the on-chain
# hasher's `sha2` feature resolves, so this declaration reuses the SAME
# lockfile instance instead of compiling a second copy of the crypto
# core into the snapshotter (the 0.11 bump would have split the tree —
# Dependabot files 0.x minors as majors; ignored in .github/dependabot.yml).
sha2 = "0.10"
# Sealed snapshot artifact persistence (Phase 5.2): deterministic JSON
# with hex-encoded hashes and canonical base58 pubkeys. Both crates are
# already resolved in Cargo.lock via the workspace graph — no new
# resolution churn.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Leaf-format compatibility lock: the snapshot's (holder, balance) entries
# must feed `grave_vault::merkle::compute_leaf` byte-for-byte. Type identity
# (anchor-world Pubkey == solana-sdk Pubkey) is proven at compile time by
# simply passing our entries into the vault's leaf function.
grave-vault = { path = "../programs/grave-vault" }
# UNCX constants drift lock: the snapshotter's locker facts must stay
# byte-identical to the on-chain scanner adapter's (C5 evidence ↔ locked-LP
# attribution).
grave-scanner = { path = "../programs/grave-scanner" }
# Host builds of grave-vault's merkle code need the software sha2 backend of
# solana-sha256-hasher 3.x (the on-chain build uses the runtime syscall).
# Declaring it here unifies the feature for the whole dev-test graph — the
# same trick grave-vault's own dev-dependencies use.
solana-sha256-hasher = { version = "3.1.0", features = ["sha2"] }
# (`sha2` and `serde_json` moved to regular dependencies in Phase 5.2 —
# the tree builder and artifact persistence use them in the lib itself;
# the leaf-compatibility tests still run against the vault's own hasher
# path so the two implementations stay independently pinned.)
